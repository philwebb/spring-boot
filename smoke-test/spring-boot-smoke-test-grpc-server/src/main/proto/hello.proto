syntax = "proto3";

option java_package = "smoketest.grpcserver.proto";

service HelloWorld {
    rpc SayHello (HelloRequest) returns (HelloReply) {}
    rpc StreamHello(HelloRequest) returns (stream HelloReply) {}
}

message HelloRequest {
    string name = 1;
}

message HelloReply {
    string message = 1;
}
